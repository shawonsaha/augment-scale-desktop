<!-- ═══════════════════════════════════════════════════════════════════════
         SCALE & SYSTEM SIMULATOR DOCK (Collapsible Field Engineering Tray)
         ═══════════════════════════════════════════════════════════════════════ -->
<div class="sim-dock-overlay" id="sim-dock-overlay"></div>
<aside class="sim-dock" id="sim-dock" aria-label="Scale Simulator Test Bench">
  <div class="sim-dock-header">
    <div class="sim-dock-title-group">
      <div class="telemetry-dot pulse"></div>
      <div>
        <h4 class="sim-dock-title">Hardware &amp; Indicator Simulator Bench</h4>
        <span class="sim-dock-sub"
          >Field Engineering • Continuous Format 1 (9600 8N1) Telemetry</span
        >
      </div>
      <span class="sim-shortcut-badge"
        >Press <kbd class="kbd-hint">~</kbd> or <kbd class="kbd-hint">Ctrl+Shift+D</kbd></span
      >
    </div>
    <button class="sim-dock-close-btn" id="btn-close-sim-dock" aria-label="Close Simulator">
      ✕
    </button>
  </div>

  <div class="sim-dock-body">
    <div class="sim-bench-group">
      <span class="sim-group-label">Physical Scale Load Presets:</span>
      <div class="sim-btn-row">
        <button class="sim-btn" id="sim-loaded-truck">Truck Loaded (28,450 kg)</button>
        <button class="sim-btn" id="sim-empty-truck">Empty Truck (12,800 kg)</button>
        <button class="sim-btn" id="sim-empty-scale">Zero Platform (0 kg)</button>
        <button class="sim-btn" id="sim-inversion-truck">Test Anomaly (11,200 kg)</button>
      </div>
    </div>

    <div class="sim-bench-group">
      <span class="sim-group-label">Hardware &amp; Communications Fault Injection:</span>
      <div class="sim-btn-row">
        <button class="sim-btn" id="sim-toggle-motion">Toggle Platform Motion (~)</button>
        <button class="sim-btn" id="sim-toggle-scale">Disconnect COM1 Serial</button>
        <button class="sim-btn" id="sim-toggle-sync-state">Simulate Cloud Outbox Fail</button>
      </div>
    </div>
  </div>
</aside>

<!-- Toast Container -->
<div class="toast-container" id="toast-container"></div>
