<!-- Shared HUD: Live Scale Instrument Hero Card -->
<section class="scale-hero-card" data-hud>
  <div class="scale-hero-header">
    <div class="scale-stability-badge disconnected" data-hud-badge>✕ DISCONNECTED</div>
    <div class="scale-indicators-cluster">
      <span class="scale-indicator-tag active" data-hud-tag-gross>GROSS</span>
      <span class="scale-indicator-tag zero-active" data-hud-tag-zero style="display: none"
        >&gt;0&lt; ZERO</span
      >
    </div>
  </div>
  <div class="scale-readout-center">
    <span class="scale-digits disconnected" data-hud-digits>------</span>
    <span class="scale-unit">KG</span>
  </div>
</section>
