<!-- ═══════════════════════════════════════════════════════════════════════
         SCREEN: HISTORY LEDGER (completed + voided + pending + deleted)
         ═══════════════════════════════════════════════════════════════════════ -->
<main class="screen" id="history-screen">
  <div class="history-screen">
    <!-- Filter bar -->
    <section class="hist-filter-bar" aria-label="History filters">
      <div class="hist-search">
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
        <input
          type="text"
          id="hist-search-input"
          placeholder="Search ticket, plate, driver, client…"
          autocomplete="off"
          spellcheck="false"
        />
        <kbd class="hist-search-kbd">/</kbd>
      </div>

      <div class="hist-filter-group">
        <select id="hist-date-filter" class="hist-select" aria-label="Date range">
          <option value="today">Today</option>
          <option value="yesterday">Yesterday</option>
          <option value="7days">Last 7 days</option>
          <option value="30days">Last 30 days</option>
          <option value="custom">Custom range…</option>
        </select>
        <input
          type="date"
          id="hist-date-from"
          class="hist-date-input"
          hidden
          aria-label="From date"
        />
        <input type="date" id="hist-date-to" class="hist-date-input" hidden aria-label="To date" />
      </div>

      <div class="hist-more-wrap">
        <button
          type="button"
          class="hist-more-btn"
          id="hist-filters-btn"
          aria-expanded="false"
          aria-controls="hist-more-popover"
        >
          Filters
          <span class="hist-more-count" id="hist-more-count" hidden>0</span>
        </button>
        <div class="hist-more-popover hist-filter-panel" id="hist-more-popover" hidden>
          <div class="hist-more-body" id="hist-more-body"></div>
          <div class="hist-more-footer">
            <button type="button" class="hist-more-clear" id="hist-more-clear">Clear all</button>
            <button type="button" class="hist-more-apply" id="hist-more-apply">
              Apply filters
            </button>
          </div>
        </div>
      </div>

      <button type="button" class="hist-report-btn" id="hist-report-btn">
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M6 9V2h12v7" />
          <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
          <rect x="6" y="14" width="12" height="8" rx="1" />
        </svg>
        Print report
      </button>

      <button type="button" class="hist-more-btn" id="hist-verify-btn">
        <svg
          width="15"
          height="15"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
          <path d="m9 12 2 2 4-4" />
        </svg>
        Verify report
      </button>

      <span class="hist-keyboard-hint">
        <kbd>↑</kbd><kbd>↓</kbd> rows · <kbd>PgUp</kbd><kbd>PgDn</kbd> pages ·
        <kbd>Enter</kbd> detail · <kbd>Alt+R</kbd> reprint · <kbd>Alt+P</kbd> report
      </span>
    </section>

    <div class="hist-active-filters" id="hist-active-filters" hidden></div>

    <!-- Table + detail panel -->
    <section class="hist-body">
      <div class="hist-main">
        <div class="hist-table-container" id="history-table-container">
          <table class="hist-table">
            <thead>
              <tr>
                <th class="hist-col-id" scope="col">
                  <button type="button" class="hist-sort-btn" data-sort-key="id">Ticket</button>
                </th>
                <th class="hist-col-when" scope="col">
                  <button type="button" class="hist-sort-btn" data-sort-key="when">When</button>
                </th>
                <th class="hist-col-truck" scope="col">
                  <button type="button" class="hist-sort-btn" data-sort-key="truck">Truck / Driver</button>
                </th>
                <th class="hist-col-weight" scope="col">
                  <button type="button" class="hist-sort-btn" data-sort-key="gross">Gross</button>
                </th>
                <th class="hist-col-weight" scope="col">
                  <button type="button" class="hist-sort-btn" data-sort-key="tare">Tare</button>
                </th>
                <th class="hist-col-net" scope="col">
                  <button type="button" class="hist-sort-btn" data-sort-key="net">Net</button>
                </th>
                <th class="hist-col-status" scope="col">
                  <button type="button" class="hist-sort-btn" data-sort-key="status">Status</button>
                </th>
                <th class="hist-col-override" scope="col">
                  <button type="button" class="hist-sort-btn" data-sort-key="override">Override</button>
                </th>
                <th class="hist-col-prints" scope="col">
                  <button type="button" class="hist-sort-btn" data-sort-key="prints">Prints</button>
                </th>
              </tr>
            </thead>
            <tbody id="history-tbody"></tbody>
          </table>
        </div>

        <footer class="hist-footer">
          <div class="list-footer-left">
            <button type="button" class="list-back-btn" id="hist-back">
              <span aria-hidden="true">←</span> Back <span class="list-back-kbd">Esc</span>
            </button>
            <div class="hist-pager">
              <button type="button" class="hist-page-btn" id="hist-prev" aria-label="Previous page">
                ◀
              </button>
              <span class="hist-range" id="hist-range">0–0 of 0</span>
              <button type="button" class="hist-page-btn" id="hist-next" aria-label="Next page">
                ▶
              </button>
            </div>
          </div>
          <div class="hist-summary" id="hist-summary">0 tickets</div>
        </footer>
      </div>

      <aside
        class="hist-detail-panel"
        id="history-detail"
        hidden
        aria-label="Ticket details"
      ></aside>
    </section>
  </div>
</main>
